[package]
name = "polyroute-lambda-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
base64 = "=0.22.1"
lambda_http = { version = "=1.3.2", default-features = false, features = ["apigw_http"] }
anyhow = "1"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "=0.13.5", default-features = false, features = [
  "rustls-no-provider",
  "gzip",
  "brotli",
  "deflate",
  "zstd",
  "stream",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
vercel_runtime = { version = "=2.4.1", default-features = false }
wasmtime = { version = "=50.0.2", default-features = false, features = [
  "component-model",
  "runtime",
  "std",
] }
wasmtime-wasi = { version = "=50.0.2", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "=50.0.2", default-features = false, features = ["p2"] }
zstd = { version = "0.14", default-features = false }

[[bin]]
name = "polyroute-vercel"
path = "src/vercel.rs"

[profile.release]
debug = false
strip = true
incremental = false
# The host reads its own executable before readiness, and on-demand starts on
# Vercel spend most of that phase reading it. Whole-program optimization and
# optimizing for size made the Linux executable about 45% smaller. Guest code is
# precompiled, so the host's own speed matters only where the host does the
# work.
lto = "fat"
codegen-units = 1
opt-level = "s"

# Decompressing a component is the host's longest step before readiness, and
# it measured slower when zstd was optimized for size.
[profile.release.package.zstd-sys]
opt-level = 3
