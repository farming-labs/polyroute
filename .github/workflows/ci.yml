name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: wasm32-wasip2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: "**/go.sum"
      # The same steps as "Go on Windows" in the README: componentize-go's
      # wrapper can't download its own Windows binary.
      - name: Install componentize-go's Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "v0.5.3"
          $sha256 = "253aec144b983c8d3c5d7fbfacc2e429e6beaa23b75f22cd0c8bb35ade66d06a"
          $cache = Join-Path $env:LOCALAPPDATA "bytecodealliance\componentize-go"
          $zip = Join-Path $env:TEMP "componentize-go-$version-windows-amd64.zip"
          Invoke-WebRequest "https://github.com/bytecodealliance/componentize-go/releases/download/$version/componentize-go-windows-amd64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $sha256) { throw "$zip doesn't match the release checksum." }
          Expand-Archive $zip -DestinationPath "$cache\bin" -Force
          Copy-Item "$cache\bin\componentize-go.exe" "$cache\bin\componentize-go" -Force
          Set-Content "$cache\version.txt" $version -NoNewline
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install componentize-py==0.25.1
      - run: pnpm install --frozen-lockfile
      # The addon for `experimental.runtime: "wasmtime"`, which its tests load.
      - run: pnpm --filter @farming-labs/polyroute-wasmtime build
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm smoke
      - run: pnpm smoke:packed

  native-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/polyroute-wasmtime
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:check
